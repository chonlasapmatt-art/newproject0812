# Push the database and the Edge Functions to Supabase.
#
# Before this existed, changing anything server-side meant the shop opening the
# Supabase dashboard and pasting SQL by hand — so the Edge Functions the
# checkout calls were never deployed at all, and every confirmed order was
# answered with an error. The repository is the source of truth now, and
# pushing is what deploys it.
#
# One credential, on purpose. SQL runs through the Management API rather than a
# direct Postgres connection, so the personal access token is the only thing
# needed and nobody has to go hunting for a database password. It is never
# printed and never sent anywhere to set this up.

name: Deploy database and functions to Supabase

on:
  push:
    branches: [claude/website-accessibility-check-blp19v, main]
    # Only when something server-side actually changed. A CSS commit has no
    # business restarting the shop's functions.
    paths:
      - 'site/supabase/**'
      - '.github/workflows/supabase.yml'
  # So a failed run can be retried, and so the first one can be started by hand.
  workflow_dispatch:

concurrency:
  # Two runs applying SQL at once is how a schema gets into a state nobody can
  # reproduce.
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'vshufucommkfgmdtaodq' }}

    steps:
      - uses: actions/checkout@v4

      - name: Stop early if the token is missing
        # Without this the failure arrives several steps later wearing a
        # message that sounds like the project is broken rather than unset.
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply the SQL in supabase/ci
        working-directory: site/supabase/ci
        # Every file here is written to be safe to run again, because this runs
        # them all on every deploy rather than tracking which ones it has seen.
        # That is the trade for needing no database password: no migration
        # history to keep in step, and no way for a half-applied run to leave
        # the schema somewhere the next run cannot recover from.
        run: |
          set -euo pipefail
          for file in $(ls *.sql | sort); do
            echo "── applying $file"
            # jq builds the JSON so quotes and newlines in the SQL cannot break
            # out of the payload.
            body=$(jq -Rs '{query: .}' < "$file")
            code=$(curl -sS -o response.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::$file failed with HTTP $code"
              cat response.json
              exit 1
            fi
            echo "   ok"
          done
          rm -f response.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Tell the functions which site is allowed to call them
        working-directory: site
        # Not a secret — it is the address of the public website. But unset,
        # every browser request is answered 403 "request_not_allowed", which is
        # indistinguishable from a deploy that did not work. So it is set here
        # rather than left as one more thing to remember.
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            CORS_ALLOWED_ORIGINS="$SITE_ORIGINS"
        env:
          SITE_ORIGINS: ${{ vars.SITE_ORIGINS || 'https://chonlasapmatt-art.github.io' }}

      - name: Pass through any function secrets this repository holds
        working-directory: site
        # Optional. Whichever of these the shop has added as repository secrets
        # gets pushed; the rest keep whatever the Supabase dashboard already
        # has, so an unset repository secret cannot blank out a live value.
        # Written to a file rather than a command line so no value can be read
        # out of the process list, and removed whether or not the push worked.
        run: |
          set -euo pipefail
          : > fn.env
          trap 'rm -f fn.env' EXIT
          [ -n "${SLIPOK_API_KEY:-}" ]   && printf 'SLIPOK_API_KEY=%s\n'   "$SLIPOK_API_KEY"   >> fn.env || true
          [ -n "${SLIPOK_BRANCH_ID:-}" ] && printf 'SLIPOK_BRANCH_ID=%s\n' "$SLIPOK_BRANCH_ID" >> fn.env || true
          [ -n "${PROMPTPAY_ID:-}" ]     && printf 'PROMPTPAY_ID=%s\n'     "$PROMPTPAY_ID"     >> fn.env || true
          [ -n "${OPENAI_API_KEY:-}" ]   && printf 'OPENAI_API_KEY=%s\n'   "$OPENAI_API_KEY"   >> fn.env || true
          if [ -s fn.env ]; then
            supabase secrets set --project-ref "$PROJECT_REF" --env-file fn.env
            echo "pushed $(wc -l < fn.env) function secret(s)"
          else
            echo "no function secrets in this repository — leaving the dashboard values alone"
          fi
        env:
          SLIPOK_API_KEY: ${{ secrets.SLIPOK_API_KEY }}
          SLIPOK_BRANCH_ID: ${{ secrets.SLIPOK_BRANCH_ID }}
          PROMPTPAY_ID: ${{ secrets.PROMPTPAY_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Deploy the Edge Functions
        working-directory: site
        # create-order is the one the checkout calls; the others go the same way
        # so none of them can quietly fall behind the repository.
        run: |
          set -euo pipefail
          for fn in create-order verify-slip ai-assistant; do
            echo "── deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      - name: Say what landed
        run: |
          {
            echo "### Supabase deploy"
            echo ""
            echo "Project: \`$PROJECT_REF\`"
            echo ""
            echo "SQL applied from \`site/supabase/ci\`, functions deployed: create-order, verify-slip, ai-assistant."
            echo ""
            echo "Function secrets not held here (SLIPOK_API_KEY, PROMPTPAY_ID, OPENAI_API_KEY) stay as set in the Supabase dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
