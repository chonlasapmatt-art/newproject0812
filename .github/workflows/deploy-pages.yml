name: Build and deploy ImJai to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-accessibility-check-blp19v
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  # Publishing writes the built site to the gh-pages branch, which is the
  # source GitHub Pages is serving from for this repository.
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      DEPLOY_TARGET: github-pages
      # GitHub serves a project site from /<repository>, so the base path and
      # the canonical URL are read from the repository rather than written in.
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ADMIN_PREVIEW_MODE: "false"
      # Deliberately has no fallback: an email address should not sit in a
      # public repository. Set the repository variable to switch the
      # dashboard on; until then the deployed site has no admin.
      NEXT_PUBLIC_ADMIN_EMAILS: ${{ vars.NEXT_PUBLIC_ADMIN_EMAILS }}
      # The PromptPay destination is public by necessity: it is encoded in every
      # QR the checkout renders, and it is the same number printed on the shop's
      # counter standee. It receives money and cannot be used to withdraw any.
      # Set the repository variables to point the site at a different account.
      NEXT_PUBLIC_PROMPTPAY_ID: ${{ vars.NEXT_PUBLIC_PROMPTPAY_ID || '0998756879' }}
      NEXT_PUBLIC_PROMPTPAY_NAME: ${{ vars.NEXT_PUBLIC_PROMPTPAY_NAME || 'CHONLASAP MATTAWEEWONG' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install the browser the end-to-end suite drives
        run: npx playwright install --with-deps chromium

      # The end-to-end suite runs against the exported files rather than a dev
      # server: those are what actually get published, and a dev server is one
      # more thing that can behave differently on a runner than it does locally.
      # This copy is built root-relative so it can be served from /.
      - name: Build a root-relative copy for the end-to-end suite
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ""
          # The dashboard tests need an account the build treats as staff, and
          # the admin list is baked in at build time — a test cannot grant
          # itself the role at runtime. This copy is thrown away after the
          # suite runs; the published build below uses the repository variable.
          NEXT_PUBLIC_ADMIN_EMAILS: admin@imjai.test

      - name: End-to-end tests against the exported site
        run: |
          npx --yes serve out -l 4173 &
          npx --yes wait-on -t 60000 http://localhost:4173
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Build the static site for the project subpath
        run: npm run build:pages

      # A .nojekyll file stops GitHub from dropping the _next directory, whose
      # leading underscore Jekyll treats as private — without it the site
      # loads with no CSS and no JavaScript at all.
      - name: Keep the _next directory
        run: touch out/.nojekyll

      # Published by pushing the built files to gh-pages rather than through
      # actions/deploy-pages, because that path needs the Pages source set to
      # "GitHub Actions" and the workflow token cannot set it. Pages already
      # serves this branch, so a push here is the deploy.
      - name: Publish to gh-pages
        run: |
          cd out
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}

          Generated by the deploy workflow from site/. Every file here is
          build output and is replaced wholesale on each publish."
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
